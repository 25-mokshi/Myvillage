<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View</title>
</head>
<body bgcolor="#A7769C">
    <h1 style="font-size: clamp(3rem, 7vw, 6rem); text-align: center; margin: 20px 0;">
  The Beauty
</h1>
<hr>
<!-- Floating Rounded YouTube Container -->
<!-- Video Grid Container -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 20px; max-width: 1100px; margin: 0 auto;">

  <!-- 1. Main Large Featured Video (Spans 2 columns on desktop) -->
  <div style="grid-column: span 2; position: relative; border-radius: 24px; overflow: hidden; box-shadow: 0 12px 35px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.15);">
    <iframe 
      src="https://www.youtube.com/embed/hBcD0XBWqqw?si=z8PuD4hfU22aAzPE"
      style="width: 100%; height: 420px; border: none; display: block;" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>
  </div>

  <!-- 2. Medium Side Video -->
  <div style="position: relative; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);">
    <iframe 
      src="https://www.youtube.com/embed/_6w5r6Y8uBM?si=aqcY9-xQ7NR09UuE" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>
  </div>

  <!-- 3. Small Compact Video A -->
  <div style="position: relative; border-radius: 16px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);">
    <iframe 
      src="han.mp4" 
      title="Village Sunset Clip"
      style="width: 100%; height: 200px; border: none; display: block;" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>
  </div>

  <!-- 4. Small Compact Video B -->
  

</div>
</body>
</html>
